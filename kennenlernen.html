<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d2b4e; --navy2:#163d6b;
  --teal:#0f7bc8; --teal2:#0762b0; --hell:#5fcde3;
  --gold:#e8860f; --gold2:#f5aa1c;
  --bg:#f4f8fc; --card:#fff;
  --text:#0d1f3c; --muted:#4e5a70;
  --line:rgba(13,43,78,.12);
  --spring:cubic-bezier(.34,1.42,.64,1); --ease:cubic-bezier(.25,.46,.45,.94);
}
html{background:var(--bg);color-scheme:light}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;pointer-events:none}
body::before{width:420px;height:420px;background:rgba(15,123,200,.12);top:-170px;left:-140px}
body::after{width:340px;height:340px;background:rgba(232,134,15,.09);bottom:-150px;right:-130px}

.prog{position:fixed;top:0;left:0;right:0;height:5px;background:rgba(13,43,78,.10);z-index:50}
.prog i{position:relative;display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--hell));border-radius:0 4px 4px 0;transition:width .55s var(--spring)}
.prog i::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 3px rgba(245,170,28,.28)}

.kopf{padding:22px 20px 2px;text-align:center}
.kopf svg{height:36px;width:auto}
.buehne{max-width:620px;margin:0 auto;padding:14px 20px 64px}
.schritt{animation:auf .38s var(--spring) both}
@keyframes auf{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.zaehler{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);text-align:center;margin-bottom:9px}
.intro{font-size:15.5px;color:var(--muted);text-align:center;margin:0 auto 18px;max-width:48ch}
.frage{font-size:clamp(22px,5vw,31px);font-weight:850;letter-spacing:-.03em;line-height:1.18;text-align:center;margin-bottom:20px;text-wrap:balance}

/* Antwortkarten: Illustration oben, Beschriftungsbalken unten */
.opts{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.opts[data-n="2"]{grid-template-columns:repeat(2,1fr)}
.opts[data-n="3"]{grid-template-columns:repeat(3,1fr)}
@media(max-width:519px){.opts[data-n="3"]{grid-template-columns:repeat(2,1fr)}}
.opt{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden;
  font-family:inherit;border:none;border-radius:14px;cursor:pointer;background:#e4f1fa;
  box-shadow:0 3px 14px rgba(13,43,78,.10);
  transition:transform .2s var(--spring),box-shadow .22s;
  animation:reinRutschen .4s var(--spring) both}
@keyframes reinRutschen{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.opt:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(13,43,78,.16)}
.opt:active{transform:translateY(-1px) scale(.99)}
.opt:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}

.opt-i{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 10px 14px;min-height:104px}
.opt-i svg{width:66px;height:66px;transition:transform .28s var(--spring)}
.opt:hover .opt-i svg{transform:scale(1.09) rotate(-3deg)}

.opt-t{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:12px 10px;
  background:var(--teal);color:#fff;font-size:15px;font-weight:750;letter-spacing:-.012em;line-height:1.25;overflow-wrap:anywhere;hyphens:auto;
  transition:background .18s}
.opt:hover .opt-t{background:var(--teal2)}

.opt.gewaehlt{transform:translateY(-4px) scale(1.02);box-shadow:0 0 0 4px rgba(245,170,28,.34),0 12px 28px rgba(13,43,78,.16)}
.opt.gewaehlt .opt-t{background:linear-gradient(135deg,var(--gold2),var(--gold))}
.opt.gewaehlt .opt-i{background:rgba(245,170,28,.10)}

@media(min-width:620px){
  .opts[data-n="4"]{grid-template-columns:repeat(4,1fr)}
  .opt-i svg{width:72px;height:72px}
}

/* Hinweiskarten */
.karten{display:grid;gap:9px;margin-bottom:18px}
.karte{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;
  box-shadow:0 2px 10px rgba(13,43,78,.05);animation:reinRutschen .45s var(--spring) both}
.karte b{font-size:22px;line-height:1;flex:0 0 auto}
.karte p{font-size:15px;font-weight:650}
.nachsatz{font-size:clamp(18px,3.7vw,22px);font-weight:800;letter-spacing:-.02em;text-align:center;margin-bottom:16px;text-wrap:balance}

.warum{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.warum summary{font-size:14px;font-weight:750;color:var(--teal);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.warum summary::-webkit-details-marker{display:none}
.warum summary::before{content:'?';flex:0 0 19px;height:19px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.warum[open] summary::before{background:var(--gold)}
.warum p{font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.55}
.warum strong{color:var(--text);font-weight:750}

.zurueck{display:block;margin:16px auto 0;background:none;border:none;font-family:inherit;font-size:14px;font-weight:650;color:var(--muted);cursor:pointer;padding:9px 14px;border-radius:8px}
.zurueck:hover{color:var(--text);background:rgba(13,43,78,.05)}

/* Abschluss */
.fin-h{font-size:clamp(22px,4.9vw,31px);font-weight:900;letter-spacing:-.032em;line-height:1.14;text-align:center;margin-bottom:10px;text-wrap:balance}
.fin-p{font-size:16px;color:var(--muted);text-align:center;margin-bottom:4px}
.fin-k{font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:20px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 26px rgba(13,43,78,.09)}
.feld{position:relative;margin-bottom:11px}
.feld i{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;font-style:normal;pointer-events:none}
.feld input{width:100%;font-family:inherit;font-size:16px;padding:15px 15px 15px 47px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);transition:border-color .18s,box-shadow .18s}
.feld input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,123,200,.14)}
.feld input::placeholder{color:#93a0b4}
.senden{width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;gap:9px;font-family:inherit;font-size:16.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--gold2),var(--gold));border:none;border-radius:11px;cursor:pointer;margin-top:5px;
  box-shadow:0 5px 18px rgba(232,134,15,.34);transition:transform .18s var(--spring),box-shadow .2s,filter .18s}
.senden:hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(232,134,15,.42);filter:brightness(1.05)}
.senden:disabled{background:#c2cbd8;box-shadow:none;transform:none;cursor:not-allowed}
.hinweis{font-size:12.5px;color:var(--muted);text-align:center;margin-top:13px;line-height:1.5}
.hinweis a{color:var(--teal)}

/* Gruende, das Formular auch abzuschicken */
.gruende{margin-top:24px}
.gruende h2{font-size:15px;font-weight:800;text-align:center;margin-bottom:13px}
.grund{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  box-shadow:0 2px 10px rgba(13,43,78,.05)}
.grund-i{flex:0 0 44px;height:44px;border-radius:12px;background:rgba(15,123,200,.08);display:flex;align-items:center;justify-content:center}
.grund-i svg{width:34px;height:34px}
.grund b{display:block;font-size:15px;font-weight:780;letter-spacing:-.012em;margin-bottom:2px}
.grund span{font-size:14px;color:var(--muted);line-height:1.5}

.fuss{text-align:center;font-size:12.5px;color:var(--muted);padding:20px 20px 32px}
.fuss a{color:var(--muted);text-decoration:underline}

@media(max-height:740px){
  .kopf{padding-top:14px} .kopf svg{height:30px}
  .frage{margin-bottom:15px;font-size:clamp(20px,4.5vw,27px)}
  .intro{margin-bottom:13px;font-size:14.5px}
  .opt-i{min-height:88px;padding:15px 8px 10px}
  .opt-i svg{width:56px;height:56px}
  .opt-t{min-height:48px;font-size:14px;padding:10px 8px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
/* ============================================================

/* Farbige Illustrationen, 64x64. Jede Antwort hat ihre eigene. */
var N='#0d2b4e', T='#0f7bc8', H='#5fcde3', G='#e8860f', G2='#f5aa1c', W='#fff';

function halo(f){ return '<circle cx="32" cy="31" r="22" fill="' + (f || 'rgba(15,123,200,.14)') + '"/>'; }
function punkte(){
  return '<circle cx="9" cy="14" r="2.2" fill="' + G2 + '"/>' +
         '<circle cx="55" cy="12" r="1.7" fill="' + H + '"/>' +
         '<circle cx="57" cy="47" r="2.4" fill="' + T + '" opacity=".55"/>' +
         '<circle cx="7" cy="45" r="1.6" fill="' + G + '"/>';
}
function pers(x, y, r, f){
  var b = r * 1.55;
  return '<path d="M' + (x-b) + ' ' + (y+r*2.5) + ' a' + b + ' ' + (b*1.15) + ' 0 0 1 ' + (b*2) + ' 0 z" fill="' + f + '"/>' +
         '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + f + '"/>';
}
function bild(inhalt, haloFarbe){
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
         halo(haloFarbe) + inhalt + punkte() + '</svg>';
}
function nadel(x, y, s, f){
  return '<path d="M' + x + ' ' + (y+13*s) + ' c0 0 ' + (8*s) + '-' + (8.5*s) + ' ' + (8*s) + '-' + (13.5*s) +
         ' a' + (8*s) + ' ' + (8*s) + ' 0 0 0 ' + (-16*s) + ' 0 c0 ' + (5*s) + ' ' + (8*s) + ' ' + (13.5*s) + ' ' + (8*s) + ' ' + (13.5*s) + 'z" fill="' + f + '"/>' +
         '<circle cx="' + x + '" cy="' + (y-0.5*s) + '" r="' + (3.1*s) + '" fill="' + W + '"/>';
}
function uhr(stufe, f){
  var zeiger = { klein:'M32 24v8l5 3', halb:'M32 22v10l7 4', voll:'M32 21v11l-8 5' }[stufe];
  return '<circle cx="32" cy="32" r="14" fill="' + f + '"/><circle cx="32" cy="32" r="10.5" fill="' + W + '"/>' +
         '<path d="' + zeiger + '" stroke="' + N + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
}

var BILD = {
  person1: bild(pers(32, 26, 8, T)),
  person2: bild(pers(24, 27, 7, T) + pers(40, 27, 7, G2)),
  person3: bild(pers(20, 28, 6, T) + pers(32, 25, 6.6, N) + pers(44, 28, 6, G2)),

  pin1: bild(nadel(32, 24, 1.15, T)),

  pin3: bild(nadel(20, 24, .78, T) + nadel(32, 27, .78, N) + nadel(44, 24, .78, G)),

  suche1: bild(pers(27, 26, 8, T) +
    '<circle cx="45" cy="36" r="8" fill="' + G2 + '"/><path d="M45 32v8M41 36h8" stroke="' + W + '" stroke-width="2.6" stroke-linecap="round"/>'),
  suche2: bild(pers(21, 27, 6.6, T) + pers(34, 27, 6.6, N) +
    '<circle cx="48" cy="37" r="7.4" fill="' + G2 + '"/><path d="M48 33.4v7.2M44.4 37h7.2" stroke="' + W + '" stroke-width="2.4" stroke-linecap="round"/>'),
  suche3: bild(pers(18, 28, 5.8, H) + pers(29, 26, 6.2, T) + pers(40, 28, 5.8, N) +
    '<circle cx="52" cy="38" r="6.8" fill="' + G2 + '"/><path d="M52 34.6v6.8M48.6 38h6.8" stroke="' + W + '" stroke-width="2.3" stroke-linecap="round"/>'),

  krone: bild('<path d="M16 40l-3-16 8.5 6L32 18l10.5 12L51 24l-3 16z" fill="' + G2 + '"/>' +
    '<rect x="15" y="40" width="34" height="6" rx="2.4" fill="' + G + '"/>' +
    '<circle cx="32" cy="27" r="2.6" fill="' + W + '"/>', 'rgba(245,170,28,.18)'),
  ausweis: bild('<rect x="13" y="19" width="38" height="26" rx="4.5" fill="' + T + '"/>' +
    '<rect x="13" y="19" width="38" height="7.5" rx="4.5" fill="' + N + '"/>' + pers(25, 33, 4.2, W) +

  hakenKreis: bild('<circle cx="32" cy="32" r="14" fill="#1e7a4d"/>' +

  stethoskop: bild('<path d="M20 14v10a8 8 0 0 0 16 0V14" stroke="' + T + '" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
    '<path d="M16 14h7M33 14h7" stroke="' + N + '" stroke-width="3.4" stroke-linecap="round"/>' +
    '<path d="M28 32v6a9 9 0 0 0 18 0v-3" stroke="' + T + '" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
    '<circle cx="46" cy="31" r="5" fill="' + G2 + '"/>'),
  fokus: bild('<circle cx="32" cy="32" r="15" fill="none" stroke="' + T + '" stroke-width="3.2"/>' +
    '<circle cx="32" cy="32" r="8" fill="none" stroke="' + H + '" stroke-width="3.2"/>' +
    '<circle cx="32" cy="32" r="3" fill="' + G + '"/>')
};

function ikon(k){ return '<span class="opt-i">' + (BILD[k] || BILD.person1) + '</span>'; }

var FRAGEN = [
  { id:'teamgroesse',
    intro:'Finden Sie heraus, ob sich Ihr Personalengpass mit einer Kampagne lösen lässt. Acht kurze Fragen, keine Vorbereitung nötig.',
    frage:'Wie viele Therapeuten sind zurzeit in Ihrer Praxis beschäftigt?',
    opts:[['1 bis 5','person1'],['6 bis 10','person2'],['11 bis 20','person3'],['Mehr als 20','personGruppe']] },
  { id:'standorte',
    frage:'Für wie viele Standorte suchen Sie Therapeuten?',
    opts:[['Einen','pin1','Ein Standort'],['Zwei bis drei','pin2'],['Mehr als drei','pin3']] },
  { id:'anzahl',
    frage:'Wie viele Therapeuten suchen Sie aktuell?',
    opts:[['Eine Stelle','suche1'],['Zwei bis drei','suche2'],['Mehr als drei','suche3']] },
  { id:'rolle',
    frage:'Was ist Ihre Rolle in der Praxis?',
    opts:[['Inhaber/in','krone','Inhaberin oder Inhaber'],['Angestellt','ausweis'],['Personalverantwortlich','klemmbrett']] },
  { id:'vakanz',
    frage:'Wie lange ist die Stelle schon unbesetzt?',
    opts:[['Noch besetzt','hakenKreis','Stelle ist noch besetzt'],['Unter 4 Wochen','uhrKlein','Weniger als 4 Wochen'],['4 bis 12 Wochen','uhrHalb'],['Über 12 Wochen','alarm','Länger als 12 Wochen']] },
  { id:'lage',
    frage:'Wo befindet sich Ihre Praxis?',
    opts:[['Ländliche Region','land','Auf dem Land oder in ländlicher Region'],['Stadt oder Umland','stadt','In einer größeren Stadt oder in deren Nähe']] },
  { id:'vorteile',
    karten:[
      {e:'💶', t:'Ein gutes Gehalt und geldwerte Vorteile'},
      {e:'⏱️', t:'Flexible Arbeitszeiten, etwa echte Teilzeitmodelle'},
      {e:'🏝️', t:'Eine Arbeitszeit, die zum Privatleben passt'},
      {e:'❤️', t:'Wertschätzung und Anerkennung für die Arbeit'}
    ],
    frage:'Therapeuten wünschen sich von ihren Arbeitgebern vor allem …',
    nachsatz:'… sind Sie bereit, in diesen Bereichen etwas zu bieten?',
    opts:[['Ja','ja','Ja, daran können wir arbeiten'],['Nein','nein','Nein, das kommt nicht infrage']],
    warum:['Gute Therapeuten können sich aussuchen, wo sie arbeiten. Wer sie zu einem Wechsel bewegen will, muss beim Angebot mithalten. Reichweite allein ersetzt das nicht.'] },
  { id:'investition', zaehler:'Letzte Frage',
    frage:'Sind Sie bereit, aktiv in die Gewinnung von Therapeuten zu investieren?',
    opts:[['Ja','ja','Ja, wenn es sich rechnet'],['Nein','nein','Nein, im Moment nicht']],
    warum:[
      '<strong>Unser Honorar ist erfolgsbasiert.</strong> Es wird erst fällig, wenn Sie jemanden einstellen. Vorher zahlen Sie uns nichts, weder Grundgebühr noch Vorkasse.',
      'Davon getrennt ist das <strong>Werbebudget</strong>, das Sie selbst tragen. Üblich sind 750 bis 1.500 Euro im Monat, die direkt an die Plattformen gehen. Ohne dieses Budget gibt es keine Reichweite, deshalb sprechen wir es vorher an und nicht hinterher.'
    ] }
];

var GRUENDE = [
  { i:'handschlag', b:'100 % erfolgsbasiert',
    t:'Unser Honorar wird erst fällig, wenn Sie jemanden einstellen. Keine Grundgebühr, keine Vorkasse, kein Risiko auf Ihrer Seite.' },
  { i:'stethoskop', b:'Von einem Physiotherapeuten geführt',
    t:'Marc Richter ist ausgebildeter Physiotherapeut und hat den Aufbau einer Praxis von null auf über 60 Mitarbeiter miterlebt. Sie müssen im Gespräch nichts erklären.' },
  { i:'fokus', b:'Nur Physio, Ergo und Logo',
    t:'Keine andere Branche. Jede Kampagne und jedes Bewerbergespräch dreht sich um Therapieberufe.' }
];

var antworten = {}, schritt = 0;
var buehne = document.getElementById('buehne');
var progFill = document.getElementById('progFill');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function zeichne(){
  progFill.style.width = Math.round(schritt / FRAGEN.length * 100) + '%';
  window.scrollTo(0, 0);
  if (schritt < FRAGEN.length) zeichneFrage(FRAGEN[schritt]);
  else zeichneAbschluss();
  antwortenFreiRuecken();
}

function zeichneFrage(f){
  var h = '<div class="schritt">';
  h += '<div class="zaehler">' + (f.zaehler ? esc(f.zaehler) : 'Frage ' + (schritt+1) + ' von ' + FRAGEN.length) + '</div>';
  if (f.intro) h += '<p class="intro">' + esc(f.intro) + '</p>';
  h += '<h1 class="frage">' + esc(f.frage) + '</h1>';
  if (f.karten){
    h += '<div class="karten">';
    f.karten.forEach(function(k,i){
      h += '<div class="karte" style="animation-delay:' + (i*65) + 'ms"><b aria-hidden="true">' + k.e + '</b><p>' + esc(k.t) + '</p></div>';
    });
    h += '</div><p class="nachsatz">' + esc(f.nachsatz) + '</p>';
  }
  h += '<div class="opts" data-n="' + f.opts.length + '">';
  f.opts.forEach(function(o,i){
    h += '<button class="opt" data-i="' + i + '" style="animation-delay:' + (i*70 + (f.karten?280:50)) + 'ms">' +
         ikon(o[1]) + '<span class="opt-t">' + esc(o[0]) + '</span></button>';
  });
  h += '</div>';
  if (f.warum){
    h += '<details class="warum" open><summary>Warum wird diese Frage gestellt?</summary>' +
         f.warum.map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</details>';
  }
  if (schritt > 0) h += '<button class="zurueck" id="zurueck">← Zurück</button>';
  h += '</div>';
  buehne.innerHTML = h;

  buehne.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.classList.contains('gewaehlt')) return;
      b.classList.add('gewaehlt');
      var gewaehlt = f.opts[parseInt(b.dataset.i,10)];
      antworten[f.id] = gewaehlt[2] || gewaehlt[0];
      var ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function(){ schritt++; zeichne(); }, ruhig ? 0 : 250);
    });
  });
  var z = document.getElementById('zurueck');
  if (z) z.addEventListener('click', function(){ schritt--; zeichne(); });
}

function zeichneAbschluss(){
  var gruende = GRUENDE.map(function(g){
    return '<div class="grund">' +
      '<span class="grund-i">' + BILD[g.i] + '</span>' +
      '<div><b>' + esc(g.b) + '</b><span>' + esc(g.t) + '</span></div></div>';
  }).join('');

  buehne.innerHTML =
    '<div class="schritt">' +
      '<h1 class="fin-h">Danke. Jetzt können wir Ihnen sagen, ob sich eine Kampagne für Sie rechnet.</h1>' +
      '<p class="fin-p">Tragen Sie sich für das Erstgespräch ein:</p>' +
      '<p class="fin-k">kostenlos und unverbindlich</p>' +
      '<form id="anmeldung" novalidate>' +
        '<div class="feld"><i aria-hidden="true">👋</i><input type="text" id="fName" name="name" placeholder="Ihr Name" autocomplete="name" required></div>' +
        '<div class="feld"><i aria-hidden="true">✉️</i><input type="email" id="fMail" name="email" placeholder="Ihre E-Mail-Adresse" autocomplete="email" required></div>' +
        '<div class="feld"><i aria-hidden="true">📞</i><input type="tel" id="fTel" name="telefon" placeholder="Ihre Telefonnummer" autocomplete="tel" required></div>' +
        '<button type="submit" class="senden" id="btnSenden">Weiter zur Terminauswahl' +
          '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="9" x2="14" y2="9"/><polyline points="9,4 14,9 9,14"/></svg>' +
        '</button>' +
        '<p class="hinweis">Wir melden uns innerhalb von 24 Stunden. Mit dem Absenden stimmen Sie unserer <a href="/datenschutz" target="_blank" rel="noopener">Datenschutzerklärung</a> zu.</p>' +
      '</form>' +
      '<button class="zurueck" id="zurueck">← Zurück</button>' +
      '<section class="gruende"><h2>Was Sie von uns erwarten können</h2>' + gruende + '</section>' +
    '</div>';

  document.getElementById('zurueck').addEventListener('click', function(){ schritt--; zeichne(); });
  document.getElementById('anmeldung').addEventListener('submit', absenden);
}

/* Der Einwilligungsbanner liegt fest über dem Seitenende und fährt animiert
   ein. Solange er da ist, wird nachgemessen und nur dann gescrollt, wenn
   Antwortflächen sonst dahinter verschwinden würden. */
var nachlauf = null;
function antwortenFreiRuecken(){
  clearInterval(nachlauf);
  var runden = 0;
  ruecken();
  nachlauf = setInterval(function(){
    ruecken();
    if (++runden > 12 || !document.querySelector('.tr-cc')) clearInterval(nachlauf);
  }, 260);
}
function ruecken(){
  var kasten = document.querySelector('.opts') || document.querySelector('form');
  var banner = document.querySelector('.tr-cc .tr-cc-box');
  if (!kasten || !banner) return;
  var frei = innerHeight - banner.getBoundingClientRect().height - 18;
  var fehlt = Math.ceil(kasten.getBoundingClientRect().bottom - frei);
  if (fehlt > 2) window.scrollTo(0, window.scrollY + fehlt);
}
(function(){
  if (document.querySelector('.tr-cc')) return;
  var beobachter = new MutationObserver(function(){
    if (document.querySelector('.tr-cc .tr-cc-box')) { beobachter.disconnect(); antwortenFreiRuecken(); }
  });
  beobachter.observe(document.body, { childList: true });
  setTimeout(function(){ beobachter.disconnect(); }, 12000);
})();

function absenden(e){
  e.preventDefault();
  var name = document.getElementById('fName').value.trim();
  var mail = document.getElementById('fMail').value.trim();
  var tel  = document.getElementById('fTel').value.trim();
  var btn  = document.getElementById('btnSenden');

  if (!name || !mail || !tel){ alert('Bitte füllen Sie alle drei Felder aus.'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(mail)){ alert('Bitte prüfen Sie die E-Mail-Adresse.'); return; }

  btn.disabled = true;
  btn.textContent = 'Wird gesendet …';

  var daten = { name:name, email:mail, telefon:tel, _subject:'Kennenlern-Funnel: ' + name };
  FRAGEN.forEach(function(f){ daten[f.id] = antworten[f.id] || '–'; });

  fetch('https://formspree.io/f/mykvyrbb', {
    method:'POST',
    headers:{ 'Accept':'application/json', 'Content-Type':'application/json' },
    body: JSON.stringify(daten)
  })
  .then(function(r){ if (r.ok) location.href = '/danke?name=' + encodeURIComponent(name); else fehler(btn); })
  .catch(function(){ fehler(btn); });
}

function fehler(btn){
  btn.disabled = false;
  btn.textContent = 'Weiter zur Terminauswahl';
  alert('Beim Senden ist etwas schiefgelaufen. Bitte versuchen Sie es erneut oder schreiben Sie uns an info@thera-recruiting.de');
}

zeichne();
</script>
